apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flappies.fullname" . }}-api
  labels:
    {{- include "flappies.labels" . | nindent 4 }}
    {{- include "flappies.selectorLabels" (dict "component" "api" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "flappies.selectorLabels" (dict "component" "api" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flappies.selectorLabels" (dict "component" "api" "Release" .Release) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "flappies.fullname" . }}-config
            - secretRef:
                name: {{ include "flappies.secretName" . }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flappies.secretName" . }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flappies.fullname" . }}-api
  labels:
    {{- include "flappies.labels" . | nindent 4 }}
    {{- include "flappies.selectorLabels" (dict "component" "api" "Release" .Release) | nindent 4 }}
spec:
  selector:
    {{- include "flappies.selectorLabels" (dict "component" "api" "Release" .Release) | nindent 4 }}
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      name: http
