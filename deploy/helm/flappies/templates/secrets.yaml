{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flappies.secretName" . }}
  labels:
    {{- include "flappies.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  ZITADEL_ORG_ID: {{ .Values.secrets.zitadelOrgId | quote }}
  ZITADEL_CLIENT_ID: {{ .Values.secrets.zitadelClientId | quote }}
  ZITADEL_CLIENT_SECRET: {{ .Values.secrets.zitadelClientSecret | quote }}
  ZITADEL_AUDIENCE: {{ .Values.secrets.zitadelAudience | quote }}
  ZITADEL_PROJECT_ID: {{ .Values.secrets.zitadelProjectId | quote }}
  ZITADEL_IMPERSONATOR_PAT: {{ .Values.secrets.zitadelImpersonatorPat | quote }}
  ZITADEL_IMPERSONATOR_CLIENT_ID: {{ .Values.secrets.zitadelImpersonatorClientId | quote }}
  ZITADEL_IMPERSONATOR_CLIENT_SECRET: {{ .Values.secrets.zitadelImpersonatorClientSecret | quote }}
  CONFIG_ENCRYPTION_KEY: {{ .Values.secrets.configEncryptionKey | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  LOKI_USERNAME: {{ .Values.secrets.lokiUsername | quote }}
  LOKI_PASSWORD: {{ .Values.secrets.lokiPassword | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
{{- end }}
