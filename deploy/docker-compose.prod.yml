# Production compose: pull pre-built images from GHCR (no local build).
# Deploys ONLY the Flappies application stack (Postgres, API, frontend). It
# connects OUT to shared company infrastructure — a central ZITADEL for
# identity, and optionally Prometheus/Loki/SMTP for observability/support —
# rather than self-hosting any of that. See docs/DEPLOYMENT.md.
#
# Usage on the VPS (from the repo root):
#   cp deploy/.env.production.example deploy/.env   # edit secrets
#   docker login ghcr.io
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
# Or just run ./deploy/scripts/deploy-pull.sh, which does all of the above.

services:
  postgres:
    image: postgres:16-alpine
    container_name: flappies_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flappies}
      POSTGRES_USER: ${POSTGRES_USER:-flappies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flappies} -d ${POSTGRES_DB:-flappies}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [flappies]

  api:
    image: ghcr.io/outcastsbv/flappies-api:${FLAPPIES_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: flappies_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-flappies}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flappies}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Central ZITADEL (shared company infrastructure, not started by this file)
      ZITADEL_URL: ${ZITADEL_URL:?Set ZITADEL_URL in .env}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?Set ZITADEL_CLIENT_ID}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET:?Set ZITADEL_CLIENT_SECRET}
      ZITADEL_REDIRECT_URI: ${ZITADEL_REDIRECT_URI:?Set ZITADEL_REDIRECT_URI in .env}
      ZITADEL_AUDIENCE: ${ZITADEL_AUDIENCE:-flappies}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:?Set ZITADEL_PROJECT_ID}
      ZITADEL_IMPERSONATOR_PAT: ${ZITADEL_IMPERSONATOR_PAT:?Set ZITADEL_IMPERSONATOR_PAT}
      ZITADEL_IMPERSONATOR_CLIENT_ID: ${ZITADEL_IMPERSONATOR_CLIENT_ID:?Set ZITADEL_IMPERSONATOR_CLIENT_ID}
      ZITADEL_IMPERSONATOR_CLIENT_SECRET: ${ZITADEL_IMPERSONATOR_CLIENT_SECRET:?Set ZITADEL_IMPERSONATOR_CLIENT_SECRET}
      ZITADEL_SERVICE_PAT: ${ZITADEL_SERVICE_PAT:-}
      ZITADEL_ORG_ID: ${ZITADEL_ORG_ID:-}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Set CONFIG_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      # Observability — optional, see deploy/.env.production.example.
      TENANT_ID: ${TENANT_ID:-default}
      PROMETHEUS_PUSHGATEWAY_URL: ${PROMETHEUS_PUSHGATEWAY_URL:-}
      PROMETHEUS_PUSH_INTERVAL_MS: ${PROMETHEUS_PUSH_INTERVAL_MS:-15000}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      # Support / feature-request form — optional, see deploy/.env.production.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPPORT_EMAIL_TO: ${SUPPORT_EMAIL_TO:-support@flappies.shop}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/ready"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks: [flappies]

  frontend:
    image: ghcr.io/outcastsbv/flappies-frontend:${FLAPPIES_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: flappies_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3002}:3002"
    networks: [flappies]

networks:
  flappies:

volumes:
  postgres_data:
