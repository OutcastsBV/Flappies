services:
  postgres_test:
    image: postgres:16-alpine
    container_name: kassasysteem_postgres_test
    environment:
      POSTGRES_USER: kassa
      POSTGRES_PASSWORD: kassa_password
      POSTGRES_DB: kassasysteem
    ports:
      # 5434 avoids clashes with other local Postgres containers on 5432/5433
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kassa -d kassasysteem"]
      interval: 5s
      timeout: 3s
      retries: 10
