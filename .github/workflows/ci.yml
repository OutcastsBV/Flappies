name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run API unit tests
        run: npm run test:unit
        working-directory: api

      - name: Run frontend unit tests
        run: npm run test:unit
        working-directory: frontend

  api-e2e:
    name: API e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flappies
          POSTGRES_PASSWORD: flappies_password
          POSTGRES_DB: flappies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flappies -d flappies"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: flappies
      PGPASSWORD: flappies_password
      PGDATABASE: flappies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Run API e2e tests
        run: npm run test:e2e
        working-directory: api

  frontend-e2e:
    name: Frontend e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true
          PLAYWRIGHT_PORT: "3002"

  load-tests:
    name: Load tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Start API server
        run: |
          node server.js &
          echo $! > /tmp/api.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3001/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1
        working-directory: api

      - name: Run k6 load tests
        run: |
          docker run --rm --network host \
            -e API_URL=http://localhost:3001 \
            -v "${{ github.workspace }}/load-tests:/scripts" \
            -w /scripts \
            grafana/k6 run api-health.js --quiet

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill "$(cat /tmp/api.pid)" || true
          fi

  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
