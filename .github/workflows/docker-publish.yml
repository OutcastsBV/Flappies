name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      public_host:
        description: Public IP or hostname baked into the frontend image
        required: true
        default: "10.61.2.101"
      api_port:
        description: Public API port
        required: true
        default: "3001"
      frontend_port:
        description: Public frontend port
        required: true
        default: "3002"
      zitadel_url:
        description: >-
          Base URL of the ZITADEL instance this build should authenticate
          against. Local/dev builds self-host ZITADEL alongside the app
          (e.g. http://10.61.2.101:8080); production tenant builds point at
          the shared central ZITADEL (e.g. https://auth.company.example.com)
          provisioned via deploy/scripts/provision-tenant-zitadel.sh.
        required: true
        default: "http://10.61.2.101:8080"
      zitadel_client_id:
        description: OIDC client ID for this tenant's ZITADEL application (from provision-tenant-zitadel.sh)
        required: true
        default: "flappies"
      image_tag:
        description: Extra image tag (tenant slug + timestamp). Applied alongside latest and git sha so tenants do not share :latest.
        required: false
        default: ""
      api_url:
        description: Full public API URL baked into the frontend (e.g. https://api.acme.flappies.shop). Overrides host+port when set.
        required: false
        default: ""
      frontend_url:
        description: Full public frontend URL baked into the frontend (e.g. https://acme.flappies.shop). Overrides host+port when set.
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/outcastsbv/flappies-api
  FRONTEND_IMAGE: ghcr.io/outcastsbv/flappies-frontend

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve public URLs
        id: urls
        run: |
          HOST="${{ github.event.inputs.public_host || '10.61.2.101' }}"
          API_PORT="${{ github.event.inputs.api_port || '3001' }}"
          FE_PORT="${{ github.event.inputs.frontend_port || '3002' }}"
          Z_URL="${{ github.event.inputs.zitadel_url || 'http://10.61.2.101:8080' }}"
          Z_CLIENT_ID="${{ github.event.inputs.zitadel_client_id || 'flappies' }}"
          API_URL="${{ github.event.inputs.api_url }}"
          FE_URL="${{ github.event.inputs.frontend_url }}"
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$API_URL" ]; then API_URL="http://${HOST}:${API_PORT}"; fi
          if [ -z "$FE_URL" ]; then FE_URL="http://${HOST}:${FE_PORT}"; fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FE_URL" >> "$GITHUB_OUTPUT"
          echo "zitadel_url=$Z_URL" >> "$GITHUB_OUTPUT"
          echo "zitadel_client_id=$Z_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "redirect_uri=${FE_URL%/}/callback" >> "$GITHUB_OUTPUT"
          echo "logout_uri=${FE_URL%/}/" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "api_tags<<EOF"
            echo "${{ env.API_IMAGE }}:latest"
            echo "${{ env.API_IMAGE }}:${{ github.sha }}"
            if [ -n "$IMAGE_TAG" ]; then echo "${{ env.API_IMAGE }}:${IMAGE_TAG}"; fi
            echo "EOF"
            echo "fe_tags<<EOF"
            echo "${{ env.FRONTEND_IMAGE }}:latest"
            echo "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
            if [ -n "$IMAGE_TAG" ]; then echo "${{ env.FRONTEND_IMAGE }}:${IMAGE_TAG}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        name: Build and push API
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.urls.outputs.api_tags }}

      - uses: docker/build-push-action@v6
        name: Build and push frontend
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.urls.outputs.fe_tags }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
            NEXT_PUBLIC_ZITADEL_URL=${{ steps.urls.outputs.zitadel_url }}
            NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ steps.urls.outputs.zitadel_client_id }}
            NEXT_PUBLIC_ZITADEL_REDIRECT_URI=${{ steps.urls.outputs.redirect_uri }}
            NEXT_PUBLIC_ZITADEL_LOGOUT_URI=${{ steps.urls.outputs.logout_uri }}

      - name: Summary
        run: |
          echo "### Images published (private on GHCR)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.API_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.FRONTEND_IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend built for **${{ steps.urls.outputs.host }}**:" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.urls.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${{ steps.urls.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL: ${{ steps.urls.outputs.zitadel_url }}" >> "$GITHUB_STEP_SUMMARY"
